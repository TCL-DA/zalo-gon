[package]
name = "zalo-gon"
version = "1.0.0"
edition = "2021"
description = "Zalo gon: nguoi canh + cau noi CDP (thay zalo-canh.ps1 + bridge.py)"

[dependencies]
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Time",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
